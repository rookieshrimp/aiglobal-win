<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AI Global">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0b1a33"/>
      <stop offset="55%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="aStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="45%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="88" ry="88"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="220" r="150" fill="#0ea5e9" opacity="0.08" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.05;0.12;0.05" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Wireframe globe -->
    <g transform="translate(256 210)" filter="url(#glowCyan)" opacity="0.85">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="118" ry="118" fill="none" stroke="#67e8f9" stroke-width="1.4" opacity="0.55"/>
        <ellipse cx="0" cy="0" rx="118" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
        <ellipse cx="0" cy="0" rx="118" ry="78" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
        <ellipse cx="0" cy="0" rx="42" ry="118" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.65"/>
        <ellipse cx="0" cy="0" rx="78" ry="118" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>
        <line x1="-118" y1="0" x2="118" y2="0" stroke="#67e8f9" stroke-width="1" opacity="0.35"/>
        <line x1="0" y1="-118" x2="0" y2="118" stroke="#67e8f9" stroke-width="1" opacity="0.35"/>
      </g>
    </g>

    <!-- Stylized A -->
    <g filter="url(#glowCyan)" transform="translate(256 198)">
      <path
        d="M0 -108 L78 92 H48 L34 52 H-34 L-48 92 H-78 Z M-18 20 H18 L0 -36 Z"
        fill="rgba(56,189,248,0.12)"
        stroke="url(#aStroke)"
        stroke-width="7"
        stroke-linejoin="round"
      >
        <animate attributeName="opacity" values="0.92;1;0.92" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path
        d="M0 -72 L42 48 H24 L16 24 H-16 L-24 48 H-42 Z M-8 4 H8 L0 -28 Z"
        fill="none"
        stroke="#bae6fd"
        stroke-width="3.2"
        stroke-linejoin="round"
        opacity="0.75"
      />
    </g>

    <!-- Orbital ring (perspective) -->
    <g transform="translate(256 228)" filter="url(#glowPink)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="148" ry="28" fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity="0.95"/>
        <ellipse cx="0" cy="0" rx="148" ry="28" fill="none" stroke="#f5d0fe" stroke-width="2" opacity="0.55"/>
      </g>
    </g>

    <!-- Brand wordmark -->
    <text
      x="256"
      y="420"
      text-anchor="middle"
      font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
      font-size="52"
      font-weight="700"
      fill="#f0abfc"
      filter="url(#glowPink)"
      letter-spacing="1.5"
    >AI Global
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
